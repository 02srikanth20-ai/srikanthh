<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Well Do You Know Srikanth?</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --text: #333333;
      --correct: #2e7d32;
      --correct-bg: #e8f5e9;
      --wrong: #c62828;
      --wrong-bg: #ffebee;
      --border: #dddddd;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .quiz-container {
      background-color: var(--card-bg);
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }

    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .user-info {
      margin-bottom: 25px;
    }

    .user-info label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .user-info input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .question-block {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f0f0f0;
    }

    .question-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 15px;
      background-color: #fff;
      border: 2px solid var(--border);
      border-radius: 8px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f0f7ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* Correct and Wrong Styles */
    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
      font-weight: bold;
    }

    .feedback {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .feedback.correct-text {
      color: var(--correct);
    }

    .feedback.wrong-text {
      color: var(--wrong);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #357abd;
    }

    .result-box {
      display: none;
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      background-color: #f0f7ff;
      border-radius: 8px;
      border: 2px solid var(--primary);
    }

    .result-box h2 {
      margin-top: 0;
    }

    .score-display {
      font-size: 28px;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>How Well Do You Know Srikanth?</h1>
  <p class="subtitle">Take the quiz to find out who is Srikanth's true best friend!</p>

  <div class="user-info">
    <label for="friendName">Enter Your Name:</label>
    <input type="text" id="friendName" placeholder="Your name here..." required>
  </div>

  <div id="quiz">
    <!-- Question 1 -->
    <div class="question-block" id="q1">
      <div class="question-title">1. What is Srikanth's favorite movie?</div>
      <div class="options">
        <button class="option-btn" onclick="selectOption(1, 1)">1) Eega</button>
        <button class="option-btn" onclick="selectOption(1, 2)">2) Bahubali</button>
        <button class="option-btn" onclick="selectOption(1, 3)">3) Hi Nanna</button>
        <button class="option-btn" onclick="selectOption(1, 4)">4) HIT 3</button>
      </div>
      <div class="feedback" id="feedback-1"></div>
    </div>

    <!-- Question 2 -->
    <div class="question-block" id="q2">
      <div class="question-title">2. Who is Srikanth's favorite cricketer?</div>
      <div class="options">
        <button class="option-btn" onclick="selectOption(2, 1)">1) Sachin</button>
        <button class="option-btn" onclick="selectOption(2, 2)">2) Kohli</button>
        <button class="option-btn" onclick="selectOption(2, 3)">3) ABD</button>
        <button class="option-btn" onclick="selectOption(2, 4)">4) Dhoni</button>
      </div>
      <div class="feedback" id="feedback-2"></div>
    </div>

    <!-- Question 3 -->
    <div class="question-block" id="q3">
      <div class="question-title">3. What is Srikanth's favorite city?</div>
      <div class="options">
        <button class="option-btn" onclick="selectOption(3, 1)">1) Bangalore</button>
        <button class="option-btn" onclick="selectOption(3, 2)">2) Hyd</button>
        <button class="option-btn" onclick="selectOption(3, 3)">3) Vij</button>
        <button class="option-btn" onclick="selectOption(3, 4)">4) Patna</button>
      </div>
      <div class="feedback" id="feedback-3"></div>
    </div>

    <!-- Question 4 -->
    <div class="question-block" id="q4">
      <div class="question-title">4. What is Srikanth's favorite sport?</div>
      <div class="options">
        <button class="option-btn" onclick="selectOption(4, 1)">1) Badminton</button>
        <button class="option-btn" onclick="selectOption(4, 2)">2) Kabaddi</button>
        <button class="option-btn" onclick="selectOption(4, 3)">3) Cricket</button>
        <button class="option-btn" onclick="selectOption(4, 4)">4) Football</button>
      </div>
      <div class="feedback" id="feedback-4"></div>
    </div>

    <button class="submit-btn" onclick="calculateFinalScore()">See Final Results</button>
  </div>

  <div class="result-box" id="resultBox">
    <h2 id="greeting"></h2>
    <p>Your Total Score:</p>
    <div class="score-display" id="totalScore">0 / 80</div>
    <p id="scoreMessage"></p>
  </div>
</div>

<script>
  // Correct answers definition
  const correctAnswers = {
    1: 3, // Hi Nanna
    2: 3, // ABD
    3: 1, // Bangalore
    4: 2  // Kabaddi
  };

  const userSelections = {};

  function selectOption(questionNum, optionNum) {
    // If question is already answered, ignore further clicks
    if (userSelections[questionNum] !== undefined) return;

    userSelections[questionNum] = optionNum;
    
    const questionBlock = document.getElementById(`q${questionNum}`);
    const buttons = questionBlock.querySelectorAll('.option-btn');
    const feedbackEl = document.getElementById(`feedback-${questionNum}`);
    const correctOption = correctAnswers[questionNum];

    // Disable all options for this question
    buttons.forEach((btn, index) => {
      btn.disabled = true;
      const currentOption = index + 1;

      // Highlight correct answer in green
      if (currentOption === correctOption) {
        btn.classList.add('correct');
        btn.innerHTML += ' &#10004;'; // Green check mark
      }

      // Highlight wrong selected answer in red
      if (currentOption === optionNum && optionNum !== correctOption) {
        btn.classList.add('wrong');
        btn.innerHTML += ' &#10008;'; // Red X mark
      }
    });

    // Display immediate points breakdown
    if (optionNum === correctOption) {
      feedbackEl.className = 'feedback correct-text';
      feedbackEl.textContent = 'Correct! +20 Points';
    } else {
      feedbackEl.className = 'feedback wrong-text';
      feedbackEl.textContent = 'Wrong! 0 Points';
    }
  }

  function calculateFinalScore() {
    const friendName = document.getElementById('friendName').value.trim();
    if (!friendName) {
      alert('Please enter your name first!');
      return;
    }

    if (Object.keys(userSelections).length < 4) {
      alert('Please answer all 4 questions before submitting!');
      return;
    }

    let score = 0;
    for (let q = 1; q <= 4; q++) {
      if (userSelections[q] === correctAnswers[q]) {
        score += 20;
      }
    }

    document.getElementById('greeting').textContent = `Thanks for taking the quiz, ${friendName}!`;
    document.getElementById('totalScore').textContent = `${score} / 80 Points`;
    
    const messageEl = document.getElementById('scoreMessage');
    if (score === 80) {
      messageEl.textContent = "🏆 You are definitely Srikanth's BEST friend!";
    } else if (score >= 40) {
      messageEl.textContent = "👍 Good effort! You know Srikanth pretty well.";
    } else {
      messageEl.textContent = "😅 Oops! You need to hang out with Srikanth more often.";
    }

    document.getElementById('resultBox').style.display = 'block';
    
    // Smooth scroll to results
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
